# GLM-5.3-Flash on two GB10 boxes (DGX Spark) at TP=2: gr8, the K4 exlr8 release, int4 KV, a prompt cache on disk.
# Run this file on both boxes with the same .env (PEERS: the two LAN addresses, head first). The head serves on port 8100.
#
#   docker compose up -d                # pulls the image (CI publishes it), fetches this box's part, joins the other
#   docker compose up -d --build        # or builds the image here from the gr8 submodule
#   docker compose logs -f              # the supervisor, ready when it prints that the cluster serves
#   docker compose exec gr8 gr8 glm53f smoke
#
# .env (optional, .env.example) overrides the settings below. Compose reads it from this file's directory.
name: glm53f-2x-spark
services:
  gr8:
    build:
      context: .
    image: ${IMAGE:-ghcr.io/kindlingai/glm-5.3-flash-exlr8-2x-spark:latest}
    container_name: glm53f-2x-spark
    # The knobs (TUNE, CAP, DFLASH, MENTAT; README.md) and any other gr8 option come from .env. Unset, the image's
    # defaults apply (Dockerfile).
    env_file:
      - path: .env
        required: false
    environment:
      # the container's own paths, so a line in .env cannot point the launcher outside the volumes
      - GR8_WORK_DIR=/var/lib/gr8/home
      - MODEL_CACHE=/var/lib/gr8/cache
    # The front end (8100), the supervisor's and engine's control ports (7340, 7341) and the ConnectX fabric on the box's
    # own interfaces.
    network_mode: host
    # The launcher refuses to start next to another g6m4 on the box, and sees one started outside the container only in
    # the host's process list.
    pid: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # The ConnectX ports: the two engines exchange activations over RDMA.
    devices:
      - /dev/infiniband:/dev/infiniband
    ulimits:
      memlock: -1
      # A crash must not dump core: the engine maps ~90 GB, and the dumping thread holds the NVIDIA driver's lock the
      # whole time it writes, which can leave the box unreachable until a power cycle.
      core: 0
    cap_drop: [ALL]
    cap_add: [IPC_LOCK]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    oom_score_adj: 1000
    init: true
    stop_grace_period: 30s
    volumes:
      # The model: this box's part of the K4 release, about 86 GB, fetched from Hugging Face on the first boot. Set
      # MODEL_CACHE_DIR to a host directory owned by uid 1000 to keep it outside docker.
      - ${MODEL_CACHE_DIR:-cache}:/var/lib/gr8/cache
      # The prompt cache (kv-store.yaml): checkpoints of prompts the box has prefilled, kept across restarts.
      - ${PROMPT_CACHE_DIR:-prompts}:/var/lib/gr8/prompts
      # Logs and state: out/supervisor.log, g6m4.r0.err, shim.log, front.log.
      - ${GR8_HOME_DIR:-home}:/var/lib/gr8/home
    healthcheck:
      test: ["CMD", "/opt/glm53f-2x/bin/gr8", "glm53f", "health"]
      interval: 30s
      timeout: 5s
      start_period: 60m
    restart: on-failure

volumes:
  cache:
  prompts:
  home:
